<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>cut 7m mosaic</title>
<link rel="stylesheet" href="/app/node_modules/@fontsource/noto-sans-jp/700.css">
<link rel="stylesheet" href="/app/node_modules/@fontsource/noto-sans-jp/400.css">
<style>
  html, body { margin: 0; background: #000; overflow: hidden; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="frame" width="1920" height="1080"></canvas>
<script type="module">
// Cut 7m: synthetic alert screens pile up into one mosaic, then the totals settle over it.
// Everything is a function of t (seconds), so the recorder can step frames: window.mosaicAt(t).
const W = 1920
const H = 1080
const MARGIN = 24
const GAP = 12
const FPS = 30
const FIRST_AT = 0.2
const LAST_AT = 9.3
const START_RATE = 2
const STILL_FROM = 9.5
const SCALE_IN_S = 0.15
const SCALE_IN_FROM = 0.92
const HERO_FILL = 0.6
const CAMERA_TAU = 0.35
const SETTLE_S = 0.6
const DIM_ALPHA = 0.6
const DIM_S = 0.3
const COUNT_S = 1
const ASPECT = { '16x9': 16 / 9, '9x16': 9 / 16, '32x9': 32 / 9, '1x1': 1, pillar: 6616 / 5046 }
const SKYLINE_STEP = 2

const params = new URLSearchParams(location.search)
const manifest = await (await fetch(params.get('manifest') ?? 'out/mosaic/manifest.json')).json()
const base = new URL(params.get('manifest') ?? 'out/mosaic/manifest.json', location.href)

function mulberry32(seed) {
  let a = seed >>> 0
  return () => {
    a = (a + 0x6d2b79f5) >>> 0
    let r = Math.imul(a ^ (a >>> 15), 1 | a)
    r = (r + Math.imul(r ^ (r >>> 7), 61 | r)) ^ r
    return ((r ^ (r >>> 14)) >>> 0) / 4294967296
  }
}
const rand = mulberry32(manifest.seed)

// Rows of height h; portrait screens and every sixth landscape screen span two rows, so the mosaic reads as
// mixed sizes rather than a grid.
function spanOf(tile, index) {
  if (index === 0) return 2
  if (tile.shape === '9x16') return 2
  if (tile.shape === '16x9' && index % 6 === 3) return 2
  return 1
}

function pack(slots, h) {
  const width = W - 2 * MARGIN
  const sky = new Float64Array(width)
  const shuffle = mulberry32(manifest.seed + 1)
  const order = slots.map((slot, i) => i)
  for (let i = order.length - 1; i > 0; i--) {
    const j = Math.floor(shuffle() * (i + 1))
    ;[order[i], order[j]] = [order[j], order[i]]
  }
  const placed = new Array(slots.length)
  let bottom = 0
  for (const i of order) {
    const slot = slots[i]
    const th = slot.span * h + (slot.span - 1) * GAP
    const tw = Math.round(th * ASPECT[slot.shape])
    if (tw > width) return undefined
    let best
    for (let x = 0; x + tw <= width; x += SKYLINE_STEP) {
      let y = 0
      for (let c = x; c < Math.min(width, x + tw + GAP); c++) if (sky[c] > y) y = sky[c]
      if (!best || y < best.y) best = { x, y }
    }
    for (let c = best.x; c < Math.min(width, best.x + tw + GAP); c++) sky[c] = best.y + th + GAP
    placed[i] = { x: best.x, y: best.y, w: tw, h: th }
    bottom = Math.max(bottom, best.y + th)
  }
  return { placed, bottom }
}

function layout(tiles) {
  const slots = tiles.map((tile, i) => ({ shape: tile.shape, span: spanOf(tile, i) }))
  let lo = 10
  let hi = 400
  let fit
  while (hi - lo > 0.5) {
    const mid = (lo + hi) / 2
    const result = pack(slots, mid)
    if (result && result.bottom <= H - 2 * MARGIN) [lo, fit] = [mid, result]
    else hi = mid
  }
  const { placed, bottom } = fit
  const right = Math.max(...placed.map((p) => p.x + p.w))
  const ox = (W - right) / 2
  const oy = (H - bottom) / 2
  const rects = placed.map((p) => ({ x: p.x + ox, y: p.y + oy, w: p.w, h: p.h }))
  return { slots, rects, rowHeight: lo }
}

// Tiles go into slots of their own shape and span, shuffled so neighbours differ in place, hazard and level;
// the first tile takes the two-row landscape slot nearest the centre.
function assign(tiles, slots, rects) {
  const centre = (r) => [r.x + r.w / 2, r.y + r.h / 2]
  const dist = (r) => Math.hypot(centre(r)[0] - W / 2, centre(r)[1] - H / 2)
  const byKey = new Map()
  slots.forEach((slot, i) => {
    const key = `${slot.shape}:${slot.span}`
    if (!byKey.has(key)) byKey.set(key, [])
    byKey.get(key).push(i)
  })
  const heroKey = `${tiles[0].shape}:${slots[0].span}`
  const heroSlots = byKey.get(heroKey).sort((a, b) => dist(rects[a]) - dist(rects[b]))
  const heroSlot = heroSlots.shift()
  for (const list of byKey.values()) {
    for (let i = list.length - 1; i > 0; i--) {
      const j = Math.floor(rand() * (i + 1))
      ;[list[i], list[j]] = [list[j], list[i]]
    }
  }
  const slotOf = new Array(tiles.length)
  slotOf[0] = heroSlot
  tiles.forEach((tile, i) => {
    if (i === 0) return
    slotOf[i] = byKey.get(`${tile.shape}:${slots[i].span}`).shift()
  })
  return slotOf.map((s) => rects[s])
}

// Tiles appear outward from the first one, ease-in: START_RATE per second at first, the rest by LAST_AT.
function schedule(rects) {
  const hero = rects[0]
  const hx = hero.x + hero.w / 2
  const hy = hero.y + hero.h / 2
  const jitter = rects.map(() => rand() * 140)
  const order = rects.map((r, i) => i).sort((a, b) => {
    if (a === 0 || b === 0) return a === 0 ? -1 : 1
    const da = Math.hypot(rects[a].x + rects[a].w / 2 - hx, rects[a].y + rects[a].h / 2 - hy) + jitter[a]
    const db = Math.hypot(rects[b].x + rects[b].w / 2 - hx, rects[b].y + rects[b].h / 2 - hy) + jitter[b]
    return da - db
  })
  const n = rects.length
  const span = LAST_AT - FIRST_AT
  const a = Math.min(1, (START_RATE * span) / (n - 1))
  const g = (u) => a * u + (1 - a) * u * u * u
  const at = new Array(n)
  order.forEach((tile, k) => {
    const target = k / (n - 1)
    let lo = 0
    let hi = 1
    for (let s = 0; s < 40; s++) {
      const mid = (lo + hi) / 2
      if (g(mid) < target) lo = mid
      else hi = mid
    }
    at[tile] = FIRST_AT + hi * span
  })
  return { at, endRate: ((n - 1) / span) * (a + 3 * (1 - a)) }
}

const tiles = manifest.tiles
const { slots, rects: slotRects, rowHeight } = layout(tiles)
const rects = assign(tiles, slots, slotRects)
const { at, endRate } = schedule(rects)
const images = await Promise.all(tiles.map((tile) => new Promise((resolve, reject) => {
  const img = new Image()
  img.onload = () => resolve(img)
  img.onerror = reject
  img.src = new URL(tile.file, base).href
})))
await document.fonts.load('700 120px "Noto Sans JP"', '0123456789')
await document.fonts.load('400 28px "Noto Sans JP"', '自治体気象庁の電文レイアウト')

function cameraTarget(t) {
  let x0 = Infinity
  let y0 = Infinity
  let x1 = -Infinity
  let y1 = -Infinity
  let count = 0
  rects.forEach((r, i) => {
    if (i !== 0 && at[i] > t) return
    count++
    x0 = Math.min(x0, r.x)
    y0 = Math.min(y0, r.y)
    x1 = Math.max(x1, r.x + r.w)
    y1 = Math.max(y1, r.y + r.h)
  })
  const fill = HERO_FILL + (1 - HERO_FILL) * ((count - 1) / (rects.length - 1))
  const scale = Math.min((fill * W) / (x1 - x0), (fill * H) / (y1 - y0))
  return { cx: (x0 + x1) / 2, cy: (y0 + y1) / 2, scale }
}

const FINAL = { cx: W / 2, cy: H / 2, scale: 1 }
const cameraFrames = []
{
  let cam = cameraTarget(0)
  const k = 1 - Math.exp(-1 / FPS / CAMERA_TAU)
  for (let f = 0; f <= Math.ceil(STILL_FROM * FPS); f++) {
    const target = cameraTarget(f / FPS)
    cam = {
      cx: cam.cx + (target.cx - cam.cx) * k,
      cy: cam.cy + (target.cy - cam.cy) * k,
      scale: Math.exp(Math.log(cam.scale) + (Math.log(target.scale) - Math.log(cam.scale)) * k),
    }
    cameraFrames.push(cam)
  }
}

const smoothstep = (u) => (u <= 0 ? 0 : u >= 1 ? 1 : u * u * (3 - 2 * u))
const easeOut = (u) => 1 - Math.pow(1 - Math.min(1, Math.max(0, u)), 3)

function cameraAt(t) {
  if (t >= STILL_FROM) return FINAL
  const cam = cameraFrames[Math.min(cameraFrames.length - 1, Math.round(t * FPS))]
  const w = smoothstep((t - (STILL_FROM - SETTLE_S)) / SETTLE_S)
  return {
    cx: cam.cx + (FINAL.cx - cam.cx) * w,
    cy: cam.cy + (FINAL.cy - cam.cy) * w,
    scale: Math.exp(Math.log(cam.scale) + (Math.log(FINAL.scale) - Math.log(cam.scale)) * w),
  }
}

const NUMBERS = [
  { value: manifest.totals.municipalities, ja: '自治体', en: 'municipalities' },
  { value: manifest.totals.bulletins, ja: '気象庁の電文', en: 'JMA bulletins' },
  { value: manifest.totals.layouts, ja: 'レイアウト', en: 'layouts' },
]

function drawTotals(ctx, t) {
  const u = (t - STILL_FROM) / COUNT_S
  if (u < 0) return
  ctx.save()
  ctx.globalAlpha = smoothstep(u * 3)
  ctx.fillStyle = '#fff'
  ctx.textAlign = 'center'
  const columnW = 520
  NUMBERS.forEach((n, i) => {
    const x = W / 2 + (i - 1) * columnW
    ctx.font = '700 168px "Noto Sans JP"'
    ctx.fillText(String(Math.round(n.value * easeOut(u))), x, H / 2 + 40)
    ctx.font = '400 40px "Noto Sans JP"'
    ctx.fillText(n.ja, x, H / 2 + 112)
    ctx.font = '400 26px "Noto Sans JP"'
    ctx.globalAlpha *= 0.7
    ctx.fillText(n.en, x, H / 2 + 152)
    ctx.globalAlpha = smoothstep(u * 3)
  })
  ctx.restore()
}

const canvas = document.getElementById('frame')
const ctx = canvas.getContext('2d')
ctx.imageSmoothingQuality = 'high'

window.mosaicAt = (t) => {
  ctx.setTransform(1, 0, 0, 1, 0, 0)
  ctx.fillStyle = '#000'
  ctx.fillRect(0, 0, W, H)
  const cam = cameraAt(t)
  ctx.setTransform(cam.scale, 0, 0, cam.scale, W / 2 - cam.cx * cam.scale, H / 2 - cam.cy * cam.scale)
  rects.forEach((r, i) => {
    const age = t - (i === 0 ? 0 : at[i])
    if (age < 0) return
    const p = easeOut(age / SCALE_IN_S)
    const s = SCALE_IN_FROM + (1 - SCALE_IN_FROM) * p
    ctx.globalAlpha = Math.min(1, age / SCALE_IN_S)
    const w = r.w * s
    const h = r.h * s
    ctx.drawImage(images[i], r.x + (r.w - w) / 2, r.y + (r.h - h) / 2, w, h)
  })
  ctx.globalAlpha = 1
  ctx.setTransform(1, 0, 0, 1, 0, 0)
  if (t >= STILL_FROM) {
    ctx.fillStyle = `rgba(0,0,0,${DIM_ALPHA * smoothstep((t - STILL_FROM) / DIM_S)})`
    ctx.fillRect(0, 0, W, H)
    drawTotals(ctx, t)
  }
}

window.mosaicInfo = () => ({ count: rects.length, rowHeight, endRate, rects })
window.mosaicAt(Number(params.get('t') ?? 0))
document.body.dataset.ready = '1'
</script>
</body>
</html>
