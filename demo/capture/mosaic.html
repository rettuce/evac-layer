<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>cut 7m mosaic</title>
<link rel="stylesheet" href="/app/node_modules/@fontsource/noto-sans-jp/700.css">
<link rel="stylesheet" href="/app/node_modules/@fontsource/noto-sans-jp/400.css">
<style>
  html, body { margin: 0; background: #000; overflow: hidden; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="frame" width="1920" height="1080"></canvas>
<script type="module">
// Cut 7m: synthetic alert screens pile up into one mosaic, then the totals settle over it.
// Everything is a function of t (seconds), so the recorder can step frames: window.mosaicAt(t).
const W = 1920
const H = 1080
const MARGIN = 24
const GAP = 12
const FPS = 30
const FIRST_AT = 0.2
const LAST_AT = 9.3
const START_RATE = 2
const STILL_FROM = 9.5
const SCALE_IN_S = 0.15
const SCALE_IN_FROM = 0.92
const HERO_FILL = 0.6
const DIM_ALPHA = 0.6
const DIM_S = 0.3
const COUNT_S = 1
const ASPECT = { '16x9': 16 / 9, '9x16': 9 / 16, '32x9': 32 / 9, '1x1': 1, pillar: 6616 / 5046 }

const params = new URLSearchParams(location.search)
const manifest = await (await fetch(params.get('manifest') ?? 'out/mosaic/manifest.json')).json()
const base = new URL(params.get('manifest') ?? 'out/mosaic/manifest.json', location.href)

function mulberry32(seed) {
  let a = seed >>> 0
  return () => {
    a = (a + 0x6d2b79f5) >>> 0
    let r = Math.imul(a ^ (a >>> 15), 1 | a)
    r = (r + Math.imul(r ^ (r >>> 7), 61 | r)) ^ r
    return ((r ^ (r >>> 14)) >>> 0) / 4294967296
  }
}
const rand = mulberry32(manifest.seed)

// Rows of height h; portrait screens and every sixth landscape screen span two rows, so the mosaic reads as
// mixed sizes rather than a grid.
function spanOf(tile, index) {
  if (index === 0) return 2
  if (tile.shape === '9x16') return 2
  if (tile.shape === '16x9' && index % 6 === 3) return 2
  return 1
}

const CELL = 4

// Tiles are placed one by one at the free spot nearest the centre (with GAP around each), so the mosaic grows
// out from the first tile and ends in an organic outline instead of a rectangle.
function place(sizes, h) {
  const gw = Math.floor((W - 2 * MARGIN) / CELL)
  const gh = Math.floor((H - 2 * MARGIN) / CELL)
  const occupied = new Uint8Array(gw * gh)
  const sat = new Int32Array((gw + 1) * (gh + 1))
  const rebuild = () => {
    for (let y = 0; y < gh; y++) {
      let row = 0
      for (let x = 0; x < gw; x++) {
        row += occupied[y * gw + x]
        sat[(y + 1) * (gw + 1) + x + 1] = sat[y * (gw + 1) + x + 1] + row
      }
    }
  }
  const busy = (x0, y0, x1, y1) => sat[y1 * (gw + 1) + x1] - sat[y0 * (gw + 1) + x1] - sat[y1 * (gw + 1) + x0] + sat[y0 * (gw + 1) + x0]
  const candidates = []
  for (let y = 0; y < gh; y++) for (let x = 0; x < gw; x++) candidates.push([x, y, Math.hypot(x - gw / 2, (y - gh / 2) * 1.6)])
  candidates.sort((a, b) => a[2] - b[2])
  const gap = Math.ceil(GAP / CELL)
  const rects = []
  for (const { span, shape } of sizes) {
    const th = span * h + (span - 1) * GAP
    const tw = th * ASPECT[shape]
    const cw = Math.ceil(tw / CELL)
    const ch = Math.ceil(th / CELL)
    let spot
    for (const [cx, cy] of candidates) {
      const x0 = Math.round(cx - cw / 2)
      const y0 = Math.round(cy - ch / 2)
      if (x0 < 0 || y0 < 0 || x0 + cw > gw || y0 + ch > gh) continue
      if (busy(Math.max(0, x0 - gap), Math.max(0, y0 - gap), Math.min(gw, x0 + cw + gap), Math.min(gh, y0 + ch + gap)) === 0) {
        spot = [x0, y0]
        break
      }
    }
    if (!spot) return undefined
    for (let y = spot[1]; y < spot[1] + ch; y++) occupied.fill(1, y * gw + spot[0], y * gw + spot[0] + cw)
    rebuild()
    rects.push({ x: MARGIN + spot[0] * CELL, y: MARGIN + spot[1] * CELL, w: tw, h: th })
  }
  return rects
}

// The first tile goes in the middle; the rest in a seeded shuffle so neighbours differ in place, hazard and level.
function layout(tiles) {
  const order = tiles.map((tile, i) => i)
  for (let i = order.length - 1; i > 1; i--) {
    const j = 1 + Math.floor(rand() * i)
    ;[order[i], order[j]] = [order[j], order[i]]
  }
  const sizes = order.map((i) => ({ span: spanOf(tiles[i], i), shape: tiles[i].shape }))
  let lo = 10
  let hi = 200
  let fit
  while (hi - lo > 0.5) {
    const mid = (lo + hi) / 2
    const placed = place(sizes, mid)
    if (placed) [lo, fit] = [mid, placed]
    else hi = mid
  }
  const rects = new Array(tiles.length)
  order.forEach((tile, k) => (rects[tile] = fit[k]))
  return { rects, rowHeight: lo }
}

// Tiles appear by distance from the centre, ease-in: START_RATE per second at first, the rest by LAST_AT.
function schedule(rects) {
  const dist = (r) => Math.hypot(r.x + r.w / 2 - W / 2, r.y + r.h / 2 - H / 2)
  const order = rects.map((r, i) => i).sort((a, b) => (a === 0 ? -1 : b === 0 ? 1 : dist(rects[a]) - dist(rects[b])))
  const n = rects.length
  const span = LAST_AT - FIRST_AT
  const a = Math.min(1, (START_RATE * span) / (n - 1))
  const g = (u) => a * u + (1 - a) * u * u * u
  const at = new Array(n)
  order.forEach((tile, k) => {
    const target = k / (n - 1)
    let lo = 0
    let hi = 1
    for (let s = 0; s < 40; s++) {
      const mid = (lo + hi) / 2
      if (g(mid) < target) lo = mid
      else hi = mid
    }
    at[tile] = FIRST_AT + hi * span
  })
  at[0] = 0
  return { at, endRate: ((n - 1) / span) * (a + 3 * (1 - a)) }
}

const tiles = manifest.tiles
const { rects, rowHeight } = layout(tiles)
const { at, endRate } = schedule(rects)
const images = await Promise.all(tiles.map((tile) => new Promise((resolve, reject) => {
  const img = new Image()
  img.onload = () => resolve(img)
  img.onerror = reject
  img.src = new URL(tile.file, base).href
})))
await document.fonts.load('700 120px "Noto Sans JP"', '0123456789')
await document.fonts.load('400 28px "Noto Sans JP"', '自治体気象庁の電文レイアウト')

// The camera stays on the centre and only zooms out, at one constant rate on a log scale, from the first tile
// at HERO_FILL of the frame width to the whole mosaic at STILL_FROM.
const smoothstep = (u) => (u <= 0 ? 0 : u >= 1 ? 1 : u * u * (3 - 2 * u))
const easeOut = (u) => 1 - Math.pow(1 - Math.min(1, Math.max(0, u)), 3)
const ZOOM_FROM = (HERO_FILL * W) / rects[0].w
function cameraAt(t) {
  const u = Math.min(1, Math.max(0, t / STILL_FROM))
  return { cx: W / 2, cy: H / 2, scale: Math.exp(Math.log(ZOOM_FROM) * (1 - u)) }
}

const NUMBERS = [
  { value: manifest.totals.municipalities, ja: '自治体', en: 'municipalities' },
  { value: manifest.totals.bulletins, ja: '気象庁の電文', en: 'JMA bulletins' },
  { value: manifest.totals.layouts, ja: 'レイアウト', en: 'layouts' },
  { value: manifest.totals.languages, ja: '言語', en: 'languages' },
]

function drawTotals(ctx, t) {
  const u = (t - STILL_FROM) / COUNT_S
  if (u < 0) return
  ctx.save()
  ctx.globalAlpha = smoothstep(u * 3)
  ctx.fillStyle = '#fff'
  ctx.textAlign = 'center'
  const columnW = 440
  NUMBERS.forEach((n, i) => {
    const x = W / 2 + (i - 1.5) * columnW
    ctx.font = '700 168px "Noto Sans JP"'
    ctx.fillText(String(Math.round(n.value * easeOut(u))), x, H / 2 + 40)
    ctx.font = '400 40px "Noto Sans JP"'
    ctx.fillText(n.ja, x, H / 2 + 112)
    ctx.font = '400 26px "Noto Sans JP"'
    ctx.globalAlpha *= 0.7
    ctx.fillText(n.en, x, H / 2 + 152)
    ctx.globalAlpha = smoothstep(u * 3)
  })
  ctx.restore()
}

const canvas = document.getElementById('frame')
const ctx = canvas.getContext('2d')
ctx.imageSmoothingQuality = 'high'

window.mosaicAt = (t) => {
  ctx.setTransform(1, 0, 0, 1, 0, 0)
  ctx.fillStyle = '#000'
  ctx.fillRect(0, 0, W, H)
  const cam = cameraAt(t)
  ctx.setTransform(cam.scale, 0, 0, cam.scale, W / 2 - cam.cx * cam.scale, H / 2 - cam.cy * cam.scale)
  rects.forEach((r, i) => {
    const age = t - at[i]
    if (age < 0) return
    const p = easeOut(age / SCALE_IN_S)
    const s = SCALE_IN_FROM + (1 - SCALE_IN_FROM) * p
    ctx.globalAlpha = Math.min(1, age / SCALE_IN_S)
    const w = r.w * s
    const h = r.h * s
    ctx.drawImage(images[i], r.x + (r.w - w) / 2, r.y + (r.h - h) / 2, w, h)
  })
  ctx.globalAlpha = 1
  ctx.setTransform(1, 0, 0, 1, 0, 0)
  if (t >= STILL_FROM) {
    ctx.fillStyle = `rgba(0,0,0,${DIM_ALPHA * smoothstep((t - STILL_FROM) / DIM_S)})`
    ctx.fillRect(0, 0, W, H)
    drawTotals(ctx, t)
  }
}

window.mosaicInfo = () => ({ count: rects.length, rowHeight, endRate, rects })
window.mosaicAt(Number(params.get('t') ?? 0))
document.body.dataset.ready = '1'
</script>
</body>
</html>
