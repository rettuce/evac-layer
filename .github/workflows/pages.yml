name: pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

env:
  # Project site: https://rettuce.github.io/evac-layer/ — the simulator at the root, the static /screen under app/.
  SITE_BASE: /evac-layer/

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Generate the static /screen (reads app/public/static instead of /api)
        working-directory: app
        env:
          NUXT_APP_BASE_URL: ${{ env.SITE_BASE }}app/
          NUXT_PUBLIC_STATIC_SCREEN: '1'
        run: pnpm generate
      - name: Build the simulator
        working-directory: sim
        env:
          VITE_BASE: ${{ env.SITE_BASE }}
        run: |
          pnpm install --frozen-lockfile --ignore-workspace
          pnpm build
      - name: Assemble the site
        run: |
          mkdir -p site
          cp -R sim/dist/. site/
          mkdir -p site/app
          cp -R app/.output/public/. site/app/
      - name: Fetch the ambient loops (GitHub Release ambient-loops-v1, not in git)
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download ambient-loops-v1 --repo rettuce/evac-layer --pattern '*.mp4' -D site/ambient
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
        with:
          timeout: 1800000
