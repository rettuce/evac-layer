<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>EVAC LAYER sim</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400&family=Noto+Sans+JP:wght@400&display=swap" />
    <style>
      html, body { margin: 0; height: 100%; background: #000; color: #ddd; font: 12px/1.4 system-ui, sans-serif; overflow: hidden; }
      #stage { position: fixed; inset: 0; }
      #stage > canvas { position: absolute; inset: 0; pointer-events: none; }
      #ui { position: fixed; top: 12px; left: 12px; display: flex; flex-direction: column; gap: 8px; max-height: calc(100vh - 24px); overflow: auto; }
      #ui .group { background: rgba(0,0,0,.6); border: 1px solid #333; padding: 6px; display: flex; flex-wrap: wrap; gap: 4px; max-width: 280px; }
      #ui .group h2 { flex-basis: 100%; margin: 0 0 2px; font-size: 10px; font-weight: 400; letter-spacing: .08em; color: #888; text-transform: uppercase; }
      #ui button { background: #111; color: #ccc; border: 1px solid #444; padding: 4px 8px; font: inherit; cursor: pointer; }
      #ui button[aria-pressed="true"] { background: #e8e8e8; color: #000; border-color: #e8e8e8; }
      #ui button:disabled { opacity: .35; cursor: default; }
      #fps { position: fixed; right: 12px; bottom: 12px; background: rgba(0,0,0,.6); border: 1px solid #333; padding: 4px 8px; font-variant-numeric: tabular-nums; }
      #status, #hint { position: fixed; left: 12px; color: #888; background: rgba(0,0,0,.6); border: 1px solid #333; border-radius: 3px; padding: 4px 6px; }
      #status { bottom: 12px; }
      #hint { bottom: 44px; font-size: 10px; letter-spacing: .08em; }
    </style>
  </head>
  <body>
    <div id="stage"></div>
    <div id="ui"></div>
    <div id="fps">— fps</div>
    <div id="status">loading room.glb…</div>
    <div id="hint">[D] : debug toggle</div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
